<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ljudtest</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7fb; --fg:#1b2233; --card:#fff; --line:#d9dce5; --acc:#1f2f4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161f; --fg:#e8ebf2; --card:#1c2230; --line:#2e3646; --acc:#8fb0ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:.2em 0 .4em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0; }
  button { font:inherit; display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  button b { color:var(--acc); }
  #info { font-size:.9rem; white-space:pre-wrap; word-break:break-word; }
  #log { font:13px/1.4 ui-monospace, Menlo, monospace; white-space:pre-wrap; max-height:40vh; overflow:auto; }
  .muted { opacity:.75; font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Ljudtest</h1>
  <p class="muted">Tryck på knapparna en i taget, uppifrån och ner. Skriv vilka du hörde, eller ta en skärmbild av hela sidan.</p>

  <div class="card">
    <button id="beep"><b>1.</b> Vanligt ljud (en pipton)</button>
    <button id="plain"><b>2.</b> Uppläsning, standardröst</button>
    <button id="gb"><b>3.</b> Uppläsning, brittisk engelska</button>
    <button id="unlock"><b>4.</b> Slå på uppspelningsläge och läs upp igen</button>
    <div id="voices"></div>
  </div>

  <div class="card"><div id="info"></div></div>
  <div class="card"><div id="log"></div></div>
</main>
<script>
(function () {
  "use strict";
  var synth = window.speechSynthesis;
  var logEl = document.getElementById("log"), infoEl = document.getElementById("info");
  var t0 = Date.now();
  function log(m) { logEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + "s  " + m + "\n" + logEl.textContent; }
  window.addEventListener("error", function (e) { log("JS-fel: " + e.message); });
  var keep = [];

  function info() {
    var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    var v = synth ? synth.getVoices() : [];
    infoEl.textContent =
      "Enhet: " + navigator.userAgent + "\n" +
      "Öppnad från hemskärmen: " + (standalone ? "ja" : "nej") + "\n" +
      "Uppläsning finns: " + (!!(synth && window.SpeechSynthesisUtterance) ? "ja" : "nej") + "\n" +
      "Röster totalt: " + v.length + ", engelska: " + v.filter(function (x) { return /^en/i.test(x.lang); }).length + "\n" +
      "audioSession: " + (navigator.audioSession ? navigator.audioSession.type : "saknas") + "\n" +
      (synth ? "speaking=" + synth.speaking + " pending=" + synth.pending + " paused=" + synth.paused : "");
  }

  function say(label, opts) {
    if (!synth) { log(label + ": uppläsning saknas"); return; }
    var u = new SpeechSynthesisUtterance(opts.text || "Hello! This is a sound test for School Talk.");
    if (opts.lang) u.lang = opts.lang;
    if (opts.voice) u.voice = opts.voice;
    keep.push(u);
    u.onstart = function () { log(label + ": start"); };
    u.onend = function () { log(label + ": klar"); info(); };
    u.onerror = function (e) { log(label + ": FEL " + (e && e.error)); info(); };
    try {
      if (synth.speaking || synth.pending) { synth.cancel(); log("cancel (något spelades redan)"); }
      if (synth.paused) synth.resume();
      synth.speak(u);
      log(label + ": speak() anropad");
    } catch (err) { log(label + ": undantag " + err.message); }
    setTimeout(function () { if (!synth.speaking) info(); }, 1500);
    info();
  }

  // En kort pipton som WAV, skapad i webbläsaren
  function toneUrl(freq, secs, vol) {
    var rate = 22050, n = Math.floor(rate * secs), buf = new ArrayBuffer(44 + n * 2), d = new DataView(buf);
    function s(o, str) { for (var i = 0; i < str.length; i++) d.setUint8(o + i, str.charCodeAt(i)); }
    s(0, "RIFF"); d.setUint32(4, 36 + n * 2, true); s(8, "WAVE"); s(12, "fmt "); d.setUint32(16, 16, true);
    d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, rate, true); d.setUint32(28, rate * 2, true);
    d.setUint16(32, 2, true); d.setUint16(34, 16, true); s(36, "data"); d.setUint32(40, n * 2, true);
    for (var i = 0; i < n; i++) d.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * i / rate) * 32767 * vol, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  document.getElementById("beep").addEventListener("click", function () {
    var a = new Audio(toneUrl(660, 0.6, 0.5));
    a.play().then(function () { log("pipton: spelas"); }, function (e) { log("pipton: FEL " + e.name); });
  });
  document.getElementById("plain").addEventListener("click", function () { say("standardröst", {}); });
  document.getElementById("gb").addEventListener("click", function () { say("en-GB", { lang: "en-GB" }); });
  document.getElementById("unlock").addEventListener("click", function () {
    try { if (navigator.audioSession) { navigator.audioSession.type = "playback"; log("audioSession = playback"); } } catch (e) { log("audioSession: " + e.message); }
    var a = new Audio(toneUrl(440, 0.3, 0.001));
    a.play().then(function () { log("tyst ljud: spelas"); }, function (e) { log("tyst ljud: FEL " + e.name); });
    say("efter upplåsning", { lang: "en-GB" });
  });

  function renderVoices() {
    if (!synth) return;
    var en = synth.getVoices().filter(function (x) { return /^en[-_]GB/i.test(x.lang); });
    var box = document.getElementById("voices");
    box.innerHTML = en.length ? '<p class="muted">5. Brittiska röster, en i taget:</p>' : "";
    en.forEach(function (v) {
      var b = document.createElement("button");
      b.textContent = v.name + " (" + v.lang + ")";
      b.addEventListener("click", function () { say(v.name, { voice: v, lang: v.lang }); });
      box.appendChild(b);
    });
    info();
  }
  if (synth) {
    renderVoices();
    if ("onvoiceschanged" in synth) synth.onvoiceschanged = renderVoices;
    setTimeout(renderVoices, 1000);
  }
  info();
})();
</script>
</body>
</html>
